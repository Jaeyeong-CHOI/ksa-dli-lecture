</style><header><span>HERITAGE / BRIEF</span><small>실제 API 응답으로 만든 학습 예시</small></header><main><div class="eyebrow">PUBLIC DATA → USEFUL PAGE</div><h1>우리 유산을,<br>근거와 함께 살펴보세요.</h1><p class="intro">국가유산청에서 조회한 이름·지역·설명을 모았습니다. 결과를 바꿔 보고, 설명을 펼친 뒤 공식 응답과 대조해 보세요.</p><div class="toolbar"><button data-key="a" aria-pressed="true">입력 A · 경복궁</button><button data-key="b" aria-pressed="false">입력 B · 첨성대</button><input id="filter" aria-label="현재 결과에서 이름 검색" placeholder="현재 결과에서 이름 검색"></div><p class="meta" id="meta" aria-live="polite"></p><div id="cards" class="cards"></div><div class="note"><strong>조회 시점의 스냅샷입니다.</strong> 브라우저가 API를 새로 호출하지 않습니다. 운영시간·입장료·실시간 개방 여부는 이 데이터로 확인하지 않습니다.</div></main><footer>공공데이터포털 · 국가유산청_전국 지정문화재 현황 · <a href="https://www.data.go.kr/data/15034324/openapi.do" target="_blank" rel="noopener">데이터 설명 열기</a></footer><script>
const DATA={"a": {"status": "ok", "query": "경복궁", "total": 11, "returned": 3, "retrievedAt": "2026-09-13T05:20:46.376180+00:00", "sourceUrl": "https://www.khs.go.kr/cha/SearchKindOpenapiList.do?ccbaMnm1=%EA%B2%BD%EB%B3%B5%EA%B6%81&pageUnit=3&pageIndex=1", "items": [{"name": "경복궁 근정전", "type": "국보", "region": "서울특별시", "address": "서울특별시 종로구 사직로 161 (세종로, 경복궁)", "description": "경복궁 근정전은 조선시대 법궁인 경복궁의 중심 건물로, 신하들이 임금에게 새해 인사를 드리거나 국가의식을 거행하고 외국 사신을 맞이하던 곳이다. \n 태조 4년(1395)에 지었으며, 정종과 세종을 비롯한 조선 전기의 여러 왕들이 이곳에서 즉위식을 하기도 하였다. ‘근정’이란 이름은 천하의 일은 부지런하면 잘 다스려진다는 의미를 담고 있는 것으로, 정도전이 지었다. 지금 있는 건물은 임진왜란 때 불탄 것을 고종 4년(1867) 다시 지은 것이다. \n 앞면 5칸·옆면 5칸 크기의 2층 건물로 지붕은 옆면에서 볼 때 여덟 팔(八)자 모양인 팔작지붕이다. 지붕 처마를 받치기 위해 장식하여 짜여진 구조가 기둥 위뿐만 아니라 기둥 사이에도 있는 다포식 건물이며 그 형태가 화려한 모습을 띠고 있다. 건물의 기단인 월대의 귀퉁이나 계단 주위 난간기둥에 훌륭한 솜씨로 12지신상을 비롯한 동물상들을 조각해 놓았다.\n 건물 내부는 아래·위가 트인 통층으로 뒷편 가운데에 임금의 자리인 어좌가 있다. 어좌 뒤에는 ‘일월오악도’병풍을 놓았고, 위는 화려한 장식으로 꾸몄다.\n 근정전에서 근정문에 이르는 길 좌우에는 문무백관들의 지위를 표시하는 품계석이 차례로 놓여 있으며, 햇빛을 가릴 때 사용하였던 차일 고리가 앞마당에 남아 있다. 근정문 주변으로는 행각(行閣)이 연결되어 근정전을 둘러싸고 있다.\n 근정전은 조선 중기 이후 세련미를 잃어가던 수법을 가다듬어 완성시킨 왕궁의 위엄을 갖춘 웅장한 궁궐건축이다.", "ids": {"ccbaKdcd": "11", "ccbaAsno": "0002230000000", "ccbaCtcd": "11"}, "sourceUrl": "https://www.khs.go.kr/cha/SearchKindOpenapiDt.do?ccbaKdcd=11&ccbaAsno=0002230000000&ccbaCtcd=11"}, {"name": "경복궁 경회루", "type": "국보", "region": "서울특별시", "address": "서울특별시 종로구 사직로 161 (세종로, 경복궁)", "description": "경복궁 근정전 서북쪽 연못 안에 세운 경회루는, 나라에 경사가 있거나 사신이 왔을 때 연회를 베풀던 곳이다.\n 경복궁을 처음 지을 때의 경회루는 작은 규모였으나, 조선 태종 12년(1412)에 연못을 넓히면서 크게 다시 지었다. 그 후 임진왜란으로 불에 타 돌기둥만 남은 상태로 유지되어 오다가 270여 년이 지난 고종 4년(1867) 경복궁을 다시 지으면서 경회루도 다시 지었다. 연못 속에 잘 다듬은 긴 돌로 둑을 쌓아 네모 반듯한 섬을 만들고 그 안에 누각을 세웠으며, 돌다리 3개를 놓아 땅과 연결되도록 하였다. \n 앞면 7칸·옆면 5칸의 2층 건물로, 지붕은 옆면에서 볼 때 여덟 팔(八)자 모양을 한 팔작지붕이다. 지붕 처마를 받치기 위해 장식하여 만든 공포는 누각건물에서 많이 보이는 간결한 형태로 꾸몄다. 태종 때 처음 지어진 경회루는 성종 때 고쳐지으면서 누각의 돌기둥을 화려하게 용의 문양을 조각하였다고 전해지나, 임진왜란으로 소실된 이후 고종대에 다시 지으면서 지금과 같이 간결하게 바깥쪽에는 네모난 기둥을, 안쪽에는 둥근기둥을 세웠다. 1층 바닥에는 네모난 벽돌을 깔고 2층 바닥은 마루를 깔았는데, 마루의 높이를 3단으로 각각 달리하여 지위에 따라 맞는 자리에 앉도록 하였다.\n 경복궁 경회루는 우리 나라에서 단일 평면으로는 규모가 가장 큰 누각으로, 간결하면서도 호화롭게 장식한 조선 후기 누각건축의 특징을 잘 나타내고 있는 소중한 건축 문화유산이다.", "ids": {"ccbaKdcd": "11", "ccbaAsno": "0002240000000", "ccbaCtcd": "11"}, "sourceUrl": "https://www.khs.go.kr/cha/SearchKindOpenapiDt.do?ccbaKdcd=11&ccbaAsno=0002240000000&ccbaCtcd=11"}, {"name": "경복궁 자경전", "type": "보물", "region": "서울특별시", "address": "서울특별시 종로구 사직로 161 (세종로, 경복궁)", "description": "자경전은 1867년 경복궁을 다시 지으면서 자미당 터에 고종의 양어머니인 조대비(신정왕후)를 위해 지은 대비전으로서 중건 이후 화재로 소실됨에 따라서 고종 25년(1888)에 다시 지어 오늘에 이른다.\n 자경전은 대비가 일상생활을 하는 침전 건물로, 총 44칸 규모이다. 겨울에 따뜻하게 지낼 수 있도록 서북쪽에 복안당이라는 침실을 두고 중앙에는 중심 건물인 자경전을 두었다. 또, 동남쪽에는 다락집인 청연루를 두어 여름을 시원하게 보낼 수 있도록 하였다.\n 주변에는 수십 개의 집과 담장, 문들이 있었으나 일제강점기를 거치면서 대부분 없어졌다. 지금은 장수를 기원하는 뜻을 가진 글자와 꽃·나비·대나무 형태를 흙으로 구워 새겨 넣은 아름다운 꽃담장과 동식물 무늬인 십장생을 조화있게 새겨 넣은 집 모양의 굴뚝이 남아 있다.\n 자경전은 조선시대 법궁인 경복궁 안에 남아 있는 유일한 대비전이다.", "ids": {"ccbaKdcd": "12", "ccbaAsno": "0008090000000", "ccbaCtcd": "11"}, "sourceUrl": "https://www.khs.go.kr/cha/SearchKindOpenapiDt.do?ccbaKdcd=12&ccbaAsno=0008090000000&ccbaCtcd=11"}]}, "b": {"status": "ok", "query": "첨성대", "total": 1, "returned": 1, "retrievedAt": "2026-09-13T05:20:47.495950+00:00", "sourceUrl": "https://www.khs.go.kr/cha/SearchKindOpenapiList.do?ccbaMnm1=%EC%B2%A8%EC%84%B1%EB%8C%80&pageUnit=3&pageIndex=1", "items": [{"name": "경주 첨성대", "type": "국보", "region": "경상북도", "address": "경북 경주시 인왕동 839-1번지", "description": "천체의 움직임을 관찰하던 신라시대의 천문관측대로, 받침대 역할을 하는 기단부(基壇部)위에 술병 모양의 원통부(圓筒部)를 올리고 맨 위에 정(井)자형의 정상부(頂上部)를 얹은 모습으로 높이는 약9m이다.\n 원통부는 부채꼴 모양의 돌로 27단을 쌓아 올렸으며, 매끄럽게 잘 다듬어진 외부에 비해 내부는 돌의 뒷뿌리가 삐죽삐죽 나와 벽면이 고르지 않다. 남동쪽으로 난 창을 중심으로 아래쪽은 막돌로 채워져 있고 위쪽은 정상까지 뚫려서 속이 비어 있다. 동쪽 절반이 판돌로 막혀있는 정상부는 정(井)자 모양으로 맞물린 길다란 석재의 끝이 바깥까지 뚫고 나와있다. 이런 모습은 19∼20단, 25∼26단에서도 발견되는데 내부에서 사다리를 걸치기에 적당했던 것으로 보인다. 옛 기록에 의하면, “사람이 가운데로 해서 올라가게 되어있다”라고 하였는데, 바깥쪽에 사다리를 놓고 창을 통해 안으로 들어간 후 사다리를 이용해 꼭대기까지 올라가 하늘을 관찰했던 것으로 보인다. \n 천문학은 하늘의 움직임에 따라 농사 시기를 결정할 수 있다는 점에서 농업과 깊은 관계가 있으며, 관측 결과에 따라 국가의 길흉을 점치던 점성술(占星術)이 고대국가에서 중요시되었던 점으로 미루어 보면 정치와도 관련이 깊음을 알 수 있다. 따라서 일찍부터 국가의 큰 관심사가 되었으며, 이는 첨성대 건립의 좋은 배경이 되었을 것으로 여겨진다.\n 신라 선덕여왕(재위 632∼647) 때 건립된 것으로 추측되며 동양에서 가장 오래된 천문대로 그 가치가 높으며, 당시의 높은 과학 수준을 보여주는 귀중한 문화유산이라 할 수 있다.", "ids": {"ccbaKdcd": "11", "ccbaAsno": "0000310000000", "ccbaCtcd": "37"}, "sourceUrl": "https://www.khs.go.kr/cha/SearchKindOpenapiDt.do?ccbaKdcd=11&ccbaAsno=0000310000000&ccbaCtcd=37"}]}};let key='a';const filter=document.getElementById('filter');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function draw(){const d=DATA[key],items=d.items.filter(i=>i.name.toLowerCase().includes(filter.value.trim().toLowerCase()));document.getElementById('meta').textContent=`전체 일치 ${d.total}건 · 수집 ${d.returned}건 · 현재 표시 ${items.length}건 | 조회: ${new Date(d.retrievedAt).toLocaleString('ko-KR')}`;document.getElementById('cards').innerHTML=items.length?items.map(i=>`<article class="card"><div class="type">${esc(i.type)} · ${esc(i.region)}</div><h2>${esc(i.name)}</h2><p class="address">${esc(i.address||'주소 미제공')}</p><details><summary>공식 설명 읽기</summary><p>${esc(i.description||'설명 미제공')}</p></details><a href="${esc(i.sourceUrl)}" target="_blank" rel="noopener">공식 API 응답 ↗</a></article>`).join(''):'<p class="empty">현재 수집한 결과 안에 일치하는 이름이 없습니다.</p>'}
for(const b of document.querySelectorAll('[data-key]'))b.addEventListener('click',()=>{key=b.dataset.key;filter.value='';for(const x of document.querySelectorAll('[data-key]'))x.setAttribute('aria-pressed',String(x===b));draw()});filter.addEventListener('input',draw);draw();
</script></html>
